name: Build Android APK

on:
  push:
    branches: [ "main", "master" ] # Uruchamia budowanie przy wypchnięciu kodu do tych gałęzi
  pull_request:
    branches: [ "main", "master" ] # Uruchamia budowanie przy Pull Requestach

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Pobranie kodu repozytorium
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Konfiguracja Javy (wersja 17 jest standardem dla nowoczesnego Gradle/Kotlin)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu' # Możesz zmienić na 'temurin' lub 'adopt'
        java-version: '17'
        cache: 'gradle' # Automatyczne cache'owanie zależności Gradle (przyspiesza kolejne buildy)

    # 3. Nadanie uprawnień do uruchomienia skryptu gradlew
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 4. Uruchomienie testów jednostkowych (opcjonalnie, ale zalecane)
    - name: Run unit tests
      run: ./gradlew testDebugUnitTest

    # 5. Budowanie pliku APK w wersji debug
    - name: Build Debug APK
      run: ./gradlew assembleDebug

    # 6. Zapisanie zbudowanego pliku APK jako artefakt do pobrania z poziomu GitHub
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
