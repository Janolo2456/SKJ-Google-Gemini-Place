name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    # Ta oficjalna akcja automatycznie konfiguruje środowisko Gradle i cache
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    # Uruchamiamy budowanie za pomocą wbudowanej akcji Gradle, omijając lokalny skrypt gradlew
    - name: Build Debug APK
      run: gradle assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
